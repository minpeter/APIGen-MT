[project]
name = "apigen-mt"
version = "0.1.0"
description = "APIGen multi-turn tool-calling data generation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "function-schema>=0.4.5",
    "jinja2>=3.1.6",
    "pydantic>=2.11.4",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "tiktoken>=0.7.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=4.1.0",
    "transformers>=4.51.3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "tools"]

[tool.basedpyright]
pythonVersion = "3.13"

[[tool.basedpyright.executionEnvironments]]
root = "."
extraPaths = ["src"]
