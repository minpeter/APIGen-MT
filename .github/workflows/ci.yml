name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install project and all extras
        run: uv sync --all-extras --frozen

      - name: Run test suite
        run: uv run pytest --maxfail=1

      - name: Compile source and test modules
        run: uv run python -m compileall -q src tools tests

      - name: Check maintained source typing
        run: uv run basedpyright
